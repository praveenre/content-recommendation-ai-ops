name: AI Deployment & Operations Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests flask docker packaging

      - name: Step 1 - Dependency Validation Gate
        run: |
          python src/dependency_validator.py --reqs requirements.txt --dockerfile Dockerfile

      - name: Step 2 & 3 - Run Component Isolation Tests
        run: |
          python tests/test_components.py

      - name: Step 4 & 5 - Run Integration & End-to-End Tests
        run: |
          python tests/test_integration.py

      - name: Execute Complete Pipeline Verification
        run: |
          python run_pipeline.py

